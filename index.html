<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перекуп</title>
<meta name="theme-color" content="#14181f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Перекуп">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef2;--sf:#fff;--sf2:#f3f4f7;--ink:#14181f;--mut:#5d6676;--ln:#dfe2e8;--brand:#14181f;--onb:#fff;--stk:#ffd23f;--onstk:#16181d;--gain:#0f8a4b;--loss:#d6322b;--ring:#2f5bea;
--disp:"Oswald","Roboto Condensed","Arial Narrow",sans-serif;--body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1015;--sf:#151a22;--sf2:#1c222c;--ink:#eef1f5;--mut:#8d97a8;--ln:#262d39;--brand:#ffd23f;--onb:#16181d;--gain:#46d58a;--loss:#ff6b63;--ring:#8fb0ff}}
:root[data-theme="dark"]{--bg:#0d1015;--sf:#151a22;--sf2:#1c222c;--ink:#eef1f5;--mut:#8d97a8;--ln:#262d39;--brand:#ffd23f;--onb:#16181d;--gain:#46d58a;--loss:#ff6b63;--ring:#8fb0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100dvh}
aside{position:sticky;top:0;height:100dvh;background:var(--sf);border-right:1px solid var(--ln);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;margin:0 6px 22px;font:600 20px var(--disp);letter-spacing:.3px}
.plate{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--stk);color:var(--onstk);font:600 19px var(--disp);-webkit-user-select:none;user-select:none}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:500;text-align:left}
.nv:hover{background:var(--sf2);color:var(--ink)}.nv.on{background:var(--brand);color:var(--onb)}
.nv.inst{background:var(--stk);color:var(--onstk);margin-top:auto;font-weight:600}
.nv.inst:hover{filter:brightness(.95);color:var(--onstk)}
main{padding:30px 34px 60px;max-width:1120px;width:100%}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{margin:0;font:600 32px/1.1 var(--disp);letter-spacing:.2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:10px;background:var(--brand);color:var(--onb);font-weight:600}
.btn.sec{background:var(--sf2);color:var(--ink);border:1px solid var(--ln)}
.btn.sm{min-height:34px;padding:0 13px;font-size:14px}
.btn.del{background:none;color:var(--loss);border:1px solid var(--ln)}
.fab{display:none}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding:22px 24px;background:var(--sf);border:1px solid var(--ln);border-radius:20px}
.big{font:600 58px/1 var(--disp);letter-spacing:.5px}
.kvs{display:flex;gap:28px}.kv b{display:block;font:600 28px/1.1 var(--disp)}.kv span,.meta{color:var(--mut);font-size:13px}
.gain{color:var(--gain)}.loss{color:var(--loss)}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.srch{position:relative;flex:1 1 240px}.srch svg{position:absolute;left:13px;top:12px;color:var(--mut)}.srch input{padding-left:42px}
input,select{width:100%;height:44px;padding:0 13px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:16px var(--body)}
select{width:auto;min-width:150px}
.seg{display:flex;gap:2px;padding:3px;background:var(--sf2);border:1px solid var(--ln);border-radius:12px}
.seg button{padding:0 14px;height:36px;border-radius:9px;color:var(--mut);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.c{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;cursor:pointer}
.c:hover{border-color:var(--mut)}
.rw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font:500 21px/1.15 var(--disp);letter-spacing:.2px;overflow-wrap:anywhere}
.pf{font:600 21px var(--disp)}
.price{display:inline-block;padding:4px 12px 4px 15px;background:var(--stk);color:var(--onstk);font:600 22px/1.2 var(--disp);letter-spacing:.3px;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);white-space:nowrap}
.price.sm{font-size:17px;padding:2px 10px 2px 13px;clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.price.lg{font-size:38px;padding:6px 18px 6px 22px;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%,0 14px)}
.tg{display:inline-block;padding:2px 10px;margin:0 5px 5px 0;border-radius:999px;background:var(--sf2);border:1px solid var(--ln);font-size:12px;font-weight:500}
.tg.st{color:var(--mut)}
.chip{height:36px;padding:0 14px;margin:0 6px 8px 0;border-radius:18px;background:var(--sf2);border:1px solid var(--ln);font-size:14px;font-weight:500}
.chip.on{background:var(--brand);color:var(--onb);border-color:var(--brand)}
.list{background:var(--sf);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.qr{display:flex;justify-content:space-between;gap:14px;padding:13px 16px;border-bottom:1px solid var(--ln);cursor:pointer}
.qr:last-child{border-bottom:0}.qr:hover{background:var(--sf2)}
.nm2{font-weight:600}.qrt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sh{margin:26px 0 10px;font:500 20px var(--disp);letter-spacing:.3px}
.sbox{padding:16px;background:var(--sf);border:1px solid var(--ln);border-radius:16px}.sbox input{height:50px;font-size:18px;margin-bottom:12px}
.sum{display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap;margin:18px 0 4px}
.empty{padding:34px 20px;text-align:center;color:var(--mut);background:var(--sf);border:1px dashed var(--ln);border-radius:16px}
.empty .btn{margin-top:14px}
dialog{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:20px;width:min(460px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:22px}
dialog::backdrop{background:rgba(8,10,14,.6)}
dialog h3{margin:0 0 4px;font:600 24px var(--disp)}
label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{display:flex;gap:8px;margin-top:2px}.add .btn{flex:none}
.btns{display:flex;gap:8px;margin-top:22px}.btns .btn:last-child{margin-left:auto}
.hint:not(:empty){margin-top:14px;padding:9px 12px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;font-size:13px}
.err{color:var(--loss);font-size:13px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100vw - 32px);text-align:center;line-height:1.4}
.toast.hide{display:none}
@media (min-width:821px){.toast{bottom:24px}}
@media (max-width:820px){
 .app{display:block}
 aside{position:fixed;inset:auto 0 0 0;height:auto;z-index:5;flex-direction:row;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--ln)}
 .logo{display:none}.nv{flex:1;flex-direction:column;gap:3px;padding:7px 4px;font-size:12px;justify-content:center;align-items:center}
 .nv.inst{margin-top:0}
 main{padding:20px 16px calc(150px + env(safe-area-inset-bottom,0px))}
 h1{font-size:28px}.hd .btn{display:none}
 .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:18px;background:var(--stk);color:var(--onstk);box-shadow:0 6px 18px rgba(0,0,0,.28)}
 .fab svg{width:26px;height:26px}
 .big{font-size:46px}.hero{padding:18px}.kvs{width:100%;justify-content:flex-start}
 .grid{grid-template-columns:1fr}
 select{flex:1;min-width:0}.seg{width:100%}.seg button{flex:1;padding:0 6px}
 .price.lg{font-size:32px}.g2{grid-template-columns:1fr}
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92dvh}
}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
</style>
</head>
<body>
<div class="app"><aside id="nav"></aside><main id="main"></main></div>
<button class="fab" data-fab aria-label="Додати"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<dialog id="dlg"></dialog>
<datalist id="dn"></datalist><datalist id="dc"></datalist>
<div class="toast hide" id="toast"></div>
<script>
/* ========= ЗНІМОК ОРИГІНАЛУ HTML (робимо ДО будь-яких змін DOM) ========= */
const ORIGINAL_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

/* ========= PWA: манифест, иконка, установка ========= */
const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="104" fill="#ffd23f"/><text x="50%" y="50%" dy=".35em" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="330" font-weight="700" fill="#16181d">П</text></svg>`;
const ICON_URL = "data:image/svg+xml," + encodeURIComponent(ICON_SVG);

const IS_FILE = location.protocol === "file:";
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const IS_STANDALONE = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const IS_DESKTOP = !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

(function initPWA(){
  const manifest = {
    name: "Перекуп", short_name: "Перекуп",
    description: "Облік товарів, продажів і цін на ринку",
    start_url: ".", scope: ".", display: "standalone",
    background_color: "#eceef2", theme_color: "#14181f", lang: "uk",
    icons: [
      { src: ICON_URL, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
      { src: ICON_URL, sizes: "512x512", type: "image/svg+xml", purpose: "any" },
      { src: ICON_URL, sizes: "512x512", type: "image/svg+xml", purpose: "maskable" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
  const link = document.createElement("link");
  link.rel = "manifest"; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);

  const apple = document.createElement("link");
  apple.rel = "apple-touch-icon"; apple.href = ICON_URL;
  document.head.appendChild(apple);
  const fav = document.createElement("link");
  fav.rel = "icon"; fav.type = "image/svg+xml"; fav.href = ICON_URL;
  document.head.appendChild(fav);

  if (!IS_FILE && "serviceWorker" in navigator) {
    const swCode = `self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>self.clients.claim());self.addEventListener("fetch",e=>{});`;
    const swUrl = URL.createObjectURL(new Blob([swCode], { type: "text/javascript" }));
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }
})();

let deferredPrompt = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallUI();
});
window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  toast("Встановлено! Відкрий «Перекуп» з домашнього екрана 🎉");
  refreshInstallUI();
});

function showToast(msg){
  const t = document.getElementById("toast"); if(!t) return;
  t.innerHTML = msg; t.classList.remove("hide");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.add("hide"), 6500);
}
const toast = showToast;

async function installApp(){
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    refreshInstallUI();
    return;
  }
  if (IS_FILE) {
    if (IS_DESKTOP) {
      toast(
        "<b>Файл відкрито локально (file://).</b><br>" +
        "Браузер не дозволяє авто-встановлення. Варіанти:<br>" +
        "• Chrome/Edge: <b>⋮ меню → Зберегти та поділитися → Встановити як застосунок</b> (або «Створити ярлик» із галочкою «Відкривати як вікно»).<br>" +
        "• Або завантаж файл на будь-який безкоштовний хостинг (Netlify Drop, GitHub Pages) — і кнопка з'явиться сама."
      );
    } else {
      toast(
        "<b>Файл відкрито локально.</b><br>" +
        (IS_IOS
          ? "Safari: <b>Поділитися → На екран «Домів»</b>."
          : "Chrome: <b>⋮ меню → Встановити застосунок</b>.<br>Або завантаж на хостинг для повноцінного PWA.")
      );
    }
    return;
  }
  if (IS_IOS) {
    toast("<b>Safari:</b> кнопка «Поділитися» (□↑) → <b>«На екран “Домів”»</b>");
    return;
  }
  if (IS_DESKTOP) {
    toast("Відкрий меню браузера <b>⋮</b> → <b>«Встановити застосунок»</b> або <b>«Зберегти та поділитися → Встановити як застосунок»</b>.");
  } else {
    toast("Відкрий меню браузера → <b>«Встановити застосунок»</b> / <b>«Додати на головний екран»</b>.");
  }
}

function refreshInstallUI(){
  if (typeof render === "function" && document.getElementById("nav")) render();
}

/* ========= ПРИХОВАНЕ ЗАВАНТАЖЕННЯ КОДУ ========= */
function downloadCode(){
  try {
    const blob = new Blob([ORIGINAL_HTML], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "perekup.html";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
    toast("Код скачано ✓ — <b>perekup.html</b>");
  } catch(e) {
    toast("Не вдалось скачати 😕");
  }
}

// Тригер 1: Ctrl/Cmd + Shift + Alt + S
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.altKey && (e.code === "KeyS" || e.key.toLowerCase() === "s")) {
    e.preventDefault();
    downloadCode();
  }
});

// Тригер 2: 5 швидких кліків по логотипу «П» (клас .plate)
let _plateClicks = 0, _plateTimer = null;
document.addEventListener("click", e => {
  if (!e.target.closest(".plate")) return;
  _plateClicks++;
  clearTimeout(_plateTimer);
  if (_plateClicks >= 5) { _plateClicks = 0; downloadCode(); return; }
  _plateTimer = setTimeout(()=>{ _plateClicks = 0; }, 1300);
}, true);

/* ========== Основний застосунок ========== */
const K1="reseller-items-v1",K2="reseller-clients-v1",K3="reseller-quotes-v1",K4="reseller-tags-v1";
const CATS=["Авто","Аксесуари","Одяг","Інше"],DEF=["ФТ","Гідра","Пневма","Тонер","Вініл","Диски","Антихром"];
const IC={
  items:'<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>',
  market:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.2 2.4 3.5 5.2"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  download:'<path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>'
};
const ico=n=>`<svg class="i" viewBox="0 0 24 24">${IC[n]}</svg>`;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
let items=ld(K1).map(i=>({cat:"Інше",client:null,...i,buy:(i.buy||0)+(i.extra||0),extra:0,tags:i.tags||String(i.tune||"").split(/[,;]+/).map(s=>s.trim()).filter(Boolean)}));
let clients=ld(K2),quotes=ld(K3),custom=ld(K4);
const save=()=>{try{localStorage.setItem(K1,JSON.stringify(items));localStorage.setItem(K2,JSON.stringify(clients));localStorage.setItem(K3,JSON.stringify(quotes));localStorage.setItem(K4,JSON.stringify(custom))}catch(e){}};
let tab="items",q="",fs="all",fc="all",mqv="",onOk=null,onDel=null,onTag=null,dNew=false,sel=[];
const $=id=>document.getElementById(id),dlg=$("dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LK={"а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","і":"i"};
const norm=s=>[...String(s).toLowerCase()].map(c=>LK[c]||c).join(""),nsp=s=>norm(s).replace(/\s+/g,""),key=s=>s.trim().toLowerCase();
const allTags=()=>[...DEF,...custom];
function pm(s){s=String(s||"").toLowerCase().replace(/\s/g,"").replace(",",".").replace(/k/g,"к");
 const m=s.match(/^(\d*\.?\d+)(к{0,3})$/);return m?parseFloat(m[1])*[1,1e3,1e6,1e9][m[2].length]:NaN}
function fm(n){const a=Math.abs(n),r=x=>(Math.round(x*100)/100).toLocaleString("uk-UA");
 return a>=1e9?r(n/1e9)+" ккк":a>=1e6?r(n/1e6)+" кк":a>=1e3?r(n/1e3)+" к":r(n)}
const sg=n=>(n>0?"+":"")+fm(n),cls=n=>n>0?"gain":n<0?"loss":"",profit=i=>i.sell-i.buy,cl=id=>clients.find(c=>c.id===id);
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,dt=t=>new Date(t).toLocaleDateString("uk-UA");
const tgs=t=>t.length?t.map(x=>`<span class="tg">${esc(x)}</span>`).join(""):`<span class="tg st">сток</span>`;
const mem=n=>{const h=items.filter(i=>key(i.name)===key(n)).sort((a,b)=>b.id-a.id);return h.length?{b:h[0],s:h.find(i=>i.sell!=null)}:null};
function who(nm){nm=nm.trim();if(!nm)return null;let c=clients.find(x=>key(x.name)===key(nm));if(!c){c={id:Date.now(),name:nm,note:""};clients.push(c)}return c.id}
function parseQ(t){const T=allTags().map(x=>[norm(x),x]),r={model:[],tags:[],stock:false};
 t.trim().split(/\s+/).filter(Boolean).forEach(w=>{const n=norm(w),f=T.find(x=>x[0]===n);if(n===norm("сток"))r.stock=true;else if(f)r.tags.push(f[1]);else r.model.push(w)});
 r.model=r.model.join(" ");return r}
function qm(model,tags,stock,exact){const m=nsp(model);return quotes.filter(x=>(!m||nsp(x.name).includes(m))&&(stock?!x.tags.length:tags.every(t=>x.tags.some(y=>norm(y)===norm(t)))&&(!exact||x.tags.length===tags.length)))}

const TITLE={items:["Товари","Додати товар"],market:["Ринок","Додати ціну"],clients:["Клієнти","Додати клієнта"]};

function renderInstallButton(){
  if (IS_STANDALONE) return "";
  return `<button class="nv inst" data-install>${ico("download")}<span>Встановити</span></button>`;
}

function render(){
 $("nav").innerHTML=`<div class="logo"><span class="plate">П</span>Перекуп</div>`+Object.keys(TITLE).map(k=>`<button class="nv ${tab===k?"on":""}" data-tab="${k}">${ico(k)}<span>${TITLE[k][0]}</span></button>`).join("")+renderInstallButton();
 $("dn").innerHTML=[...new Set([...items,...quotes].map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join("");
 $("dc").innerHTML=clients.map(c=>`<option value="${esc(c.name)}">`).join("");
 $("main").innerHTML=`<div class="hd"><h1>${TITLE[tab][0]}</h1><button class="btn" data-fab>${TITLE[tab][1]}</button></div>`+{items:vItems,market:vMarket,clients:vClients}[tab]();
 if(tab==="market"){qchips();mres()}
}
function iCard(i){const s=i.sell!=null,c=cl(i.client);
 return `<div class="c" data-e="${i.id}"><div class="rw"><span class="meta">${i.cat}</span>${s?`<span class="pf ${cls(profit(i))}">${sg(profit(i))}</span>`:`<span class="meta">В наявності</span>`}</div>
 <div class="nm">${esc(i.name)}</div>${i.cat==="Авто"||i.tags.length?`<div>${tgs(i.tags)}</div>`:""}
 <div class="rw"><span class="meta">Купив</span><span class="price sm">${fm(i.buy)}</span>${s?`<span class="meta">Продав</span><b class="pf">${fm(i.sell)}</b>`:""}</div>
 <div class="rw" style="margin-top:auto"><span class="meta">${s?esc(c?.name||"Без покупця"):""}</span>${s?`<button class="btn sec sm" data-undo="${i.id}">Повернути</button>`:`<button class="btn sm" data-sell="${i.id}">Продати</button>`}</div></div>`}
function itemList(){
 const L=items.filter(i=>(fs==="all"||(fs==="sold")===(i.sell!=null))&&(fc==="all"||i.cat===fc)&&(!q||nsp(i.name+" "+i.tags.join(" ")).includes(nsp(q)))).sort((a,b)=>b.id-a.id);
 return L.length?`<div class="grid">${L.map(iCard).join("")}</div>`:`<div class="empty">${items.length?"Нічого не знайдено":"Тут поки порожньо. Додай першу покупку."}${items.length?"":`<br><button class="btn" data-fab>Додати товар</button>`}</div>`}
function vItems(){
 const so=items.filter(i=>i.sell!=null),p=so.reduce((s,i)=>s+profit(i),0);
 return `<div class="hero"><div><div class="big ${cls(p)}">${sg(p)}</div><div class="meta">Чистий прибуток</div></div><div class="kvs"><div class="kv"><b>${so.length}</b><span>продано</span></div><div class="kv"><b>${items.length-so.length}</b><span>в наявності</span></div></div></div>
 <div class="tb"><div class="srch">${ico("search")}<input id="q" placeholder="Пошук за назвою або тюнінгом" value="${esc(q)}"></div>
 <div class="seg">${[["all","Всі"],["stock","В наявності"],["sold","Продані"]].map(([k,l])=>`<button class="${fs===k?"on":""}" data-fs="${k}">${l}</button>`).join("")}</div>
 <select id="fc"><option value="all">Усі категорії</option>${CATS.map(c=>`<option ${fc===c?"selected":""}>${c}</option>`).join("")}</select></div><div id="lst">${itemList()}</div>`}
function vClients(){
 if(!clients.length)return `<div class="empty">Клієнтів ще немає. Додай першого або впиши нік покупця при продажі.<br><button class="btn" data-fab>Додати клієнта</button></div>`;
 return `<div class="grid">${clients.slice().sort((a,b)=>b.id-a.id).map(c=>{const b=items.filter(i=>i.client===c.id&&i.sell!=null),p=b.reduce((s,i)=>s+profit(i),0);
  return `<div class="c" data-ec="${c.id}"><div class="nm">${esc(c.name)}</div>${c.note?`<div class="meta">${esc(c.note)}</div>`:""}
  <div class="rw"><span class="meta">Покупок: ${b.length}</span>${b.length?`<span class="meta">на ${fm(b.reduce((s,i)=>s+i.sell,0))}</span><b class="pf ${cls(p)}">${sg(p)}</b>`:""}</div></div>`}).join("")}</div>`}

function vMarket(){return `<div class="sbox"><input id="mq" placeholder="Напр.: х5м фт або х5м сток" value="${esc(mqv)}" autocomplete="off"><div id="qc"></div></div><div id="mres"></div>`}
function qchips(){const T=parseQ(mqv);
 $("qc").innerHTML=`<button class="chip ${T.stock?"on":""}" data-qt="сток">Сток</button>`+allTags().map(t=>`<button class="chip ${T.tags.includes(t)?"on":""}" data-qt="${esc(t)}">${esc(t)}</button>`).join("")}
const qRow=x=>`<div class="qr" data-eq="${x.id}"><div><div class="nm2">${esc(x.name)}</div><div>${tgs(x.tags)}</div>${x.note?`<div class="meta">${esc(x.note)}</div>`:""}</div><div class="qrt"><span class="price sm">${fm(x.price)}</span><span class="meta">${dt(x.id)}</span></div></div>`;
function mres(){
 const el=$("mres"),T=parseQ(mqv);
 if(!T.model){const rec=quotes.slice().sort((a,b)=>b.id-a.id).slice(0,10);
  el.innerHTML=quotes.length?`<h3 class="sh">Останні ціни</h3><div class="list">${rec.map(qRow).join("")}</div>`:`<div class="empty" style="margin-top:14px">Напиши модель і тюнінг, і я покажу ціни, які ти вписав.<br>Спершу додай кілька цін, які питав у людей.<br><button class="btn" data-fab>Додати ціну</button></div>`;return}
 const R=qm(T.model,T.tags,T.stock).sort((a,b)=>a.price-b.price),what=`${esc(T.model)}${T.stock?" сток":""}${T.tags.length?" "+esc(T.tags.join(" + ")):""}`;
 if(!R.length){el.innerHTML=`<div class="empty" style="margin-top:14px">Цін по «${what}» ще немає.<br><button class="btn" data-fab>Додати ціну</button></div>`;return}
 const P=R.map(x=>x.price);let g="";
 if(!T.tags.length&&!T.stock){const m=new Map();R.forEach(x=>{const k=x.tags.slice().sort().join(" + ")||"Сток";(m.get(k)||m.set(k,[]).get(k)).push(x.price)});
  g=`<h3 class="sh">По тюнінгу</h3><div class="list">${[...m].map(([k,v])=>`<div class="qr" data-g="${esc(k==="Сток"?"сток":k.split(" + ").join(" "))}"><div><div class="nm2">${esc(k)}</div><div class="meta">цін: ${v.length}</div></div><div class="qrt"><span class="price sm">${fm(avg(v))}</span><span class="meta">середня</span></div></div>`).join("")}</div>`}
 el.innerHTML=`<div class="sum"><div><span class="price lg">${fm(avg(P))}</span><div class="meta" style="margin-top:6px">Середня ціна · ${what}</div></div>
 <div class="kv"><b>${fm(P[0])} – ${fm(P[P.length-1])}</b><span>мін – макс</span></div><div class="kv"><b>${R.length}</b><span>цін вписано</span></div></div>${g}<h3 class="sh">Усі ціни</h3><div class="list">${R.map(qRow).join("")}</div>`}

function tp(){return `<div id="tp">${allTags().map(t=>`<button type="button" class="chip ${sel.includes(t)?"on":""}" data-tg="${esc(t)}">${esc(t)}${custom.includes(t)?` <span data-deltag="${esc(t)}">✕</span>`:""}</button>`).join("")}</div>
 <div class="add"><input id="ntg" placeholder="Свій тег, напр. Карбон"><button type="button" class="btn sec" data-newtag>Додати</button></div>`}
function open(html,ok,del){dlg.innerHTML=`<form id="df" autocomplete="off">${html}<div class="err" id="err"></div><div class="btns">${del?`<button type="button" class="btn del" data-ddel>Видалити</button>`:""}<button type="button" class="btn sec" data-close>Скасувати</button><button type="submit" class="btn">Зберегти</button></div></form>`;onOk=ok;onDel=del;dlg.showModal()}
function ihint(){const h=$("hint");if(!h)return;const n=$("dn1").value;if(!n.trim()){h.textContent="";return}
 const Q=qm(n,sel,!sel.length,true),a=avg(Q.map(x=>x.price));h.textContent=a!=null?`Ринок: у середньому ${fm(a)} (цін: ${Q.length})`:""}
function dItem(id){const i=items.find(x=>x.id===id),sold=i&&i.sell!=null;dNew=!i;sel=i?i.tags.slice():[];onTag=ihint;
 open(`<h3>${i?"Товар":"Новий товар"}</h3><label>Назва</label><input id="dn1" list="dn" value="${esc(i?.name)}" required>
 <div class="g2"><div><label>Категорія</label><select id="dcat" style="width:100%">${CATS.map(c=>`<option ${c===i?.cat?"selected":""}>${c}</option>`).join("")}</select></div>
 <div><label>Ціна купівлі</label><input id="db" value="${i?i.buy:""}" placeholder="15кк, 300к" required></div></div>
 <label>Тюнінг (нічого не вибрано — сток)</label>${tp()}
 ${sold?`<div class="g2"><div><label>Продав за</label><input id="ds" value="${i.sell}"></div><div><label>Покупець</label><input id="dcl" list="dc" value="${esc(cl(i.client)?.name)}"></div></div>`:""}
 <div class="hint" id="hint"></div>`,
 ()=>{const b=pm($("db").value);if(isNaN(b))return"Формат суми: 15кк, 2.5кк, 300к або просто число";
  let s=null;if(sold){s=$("ds").value.trim()?pm($("ds").value):null;if(isNaN(s))return"Невірна ціна продажу"}
  const o=i||{id:Date.now(),sell:null,soldAt:null,client:null};Object.assign(o,{name:$("dn1").value.trim(),cat:$("dcat").value,buy:b,tags:sel.slice()});
  if(sold){o.sell=s;if(s==null){o.soldAt=null;o.client=null}else o.client=who($("dcl").value)}
  if(!i)items.push(o)},i?()=>{items=items.filter(x=>x!==i)}:null);ihint()}
function dSell(id){const i=items.find(x=>x.id===id),Q=qm(i.name,i.tags,!i.tags.length,true),a=avg(Q.map(x=>x.price));
 open(`<h3>${esc(i.name)}</h3><div style="margin-top:6px">${tgs(i.tags)}</div><div class="meta">Купив за ${fm(i.buy)}</div>
 <label>Продав за</label><input id="ds" placeholder="${a!=null?"ринок: "+fm(a):"15кк, 300к"}" required><label>Покупець (нік)</label><input id="dcl" list="dc">
 <div class="hint">${a!=null?`Ринок: у середньому ${fm(a)} (цін: ${Q.length}), це ${sg(a-i.buy)} до купівлі`:""}</div>`,
 ()=>{const v=pm($("ds").value);if(isNaN(v))return"Формат суми: 15кк, 2.5кк, 300к або просто число";i.sell=v;i.soldAt=Date.now();i.client=who($("dcl").value)})}
function dQuote(id){const x=quotes.find(z=>z.id===id),T=parseQ(mqv);dNew=false;sel=x?x.tags.slice():T.tags.slice();onTag=null;
 open(`<h3>${x?"Ціна з ринку":"Нова ціна з ринку"}</h3><label>Модель</label><input id="qn" list="dn" value="${esc(x?x.name:T.model)}" required>
 <label>Тюнінг (нічого не вибрано — сток)</label>${tp()}<div class="g2"><div><label>Ціна</label><input id="qp" value="${x?x.price:""}" placeholder="15кк, 300к" required></div><div><label>Примітка</label><input id="qx" value="${esc(x?.note)}" placeholder="хто, де, торг"></div></div>`,
 ()=>{const p=pm($("qp").value);if(isNaN(p))return"Формат суми: 15кк, 2.5кк, 300к або просто число";
  const o=x||{id:Date.now()};Object.assign(o,{name:$("qn").value.trim(),tags:sel.slice(),price:p,note:$("qx").value.trim()});if(!x)quotes.push(o);
  mqv=o.name+(o.tags.length?" "+o.tags.join(" "):" сток")},x?()=>{quotes=quotes.filter(z=>z!==x)}:null)}
function dClient(id){const c=clients.find(x=>x.id===id);
 open(`<h3>${c?"Клієнт":"Новий клієнт"}</h3><label>Нік</label><input id="dcn" value="${esc(c?.name)}" required><label>Нотатка або контакт</label><input id="dcx" value="${esc(c?.note)}">`,
 ()=>{const o=c||{id:Date.now()};o.name=$("dcn").value.trim();o.note=$("dcx").value.trim();if(!c)clients.push(o)},
 c?()=>{clients=clients.filter(x=>x!==c);items.forEach(i=>{if(i.client===c.id)i.client=null})}:null)}
function addTag(){const v=$("ntg").value.trim();if(!v)return;if(!allTags().some(t=>norm(t)===norm(v)))custom.push(v);const t=allTags().find(t=>norm(t)===norm(v));if(!sel.includes(t))sel.push(t);$("tp").parentNode.querySelector(".add").remove();$("tp").outerHTML=tp();save();onTag&&onTag()}
const retp=()=>{const a=$("tp").parentNode.querySelector(".add");a.remove();$("tp").outerHTML=tp()};

document.addEventListener("input",e=>{const id=e.target.id;
 if(id==="q"){q=e.target.value;$("lst").innerHTML=itemList()}
 else if(id==="mq"){mqv=e.target.value;qchips();mres()}
 else if(id==="dn1"){if(dNew){const m=mem(e.target.value);if(m){$("dcat").value=m.b.cat;$("db").value=m.b.buy;sel=m.b.tags.slice();retp()}}ihint()}});
document.addEventListener("keydown",e=>{if(e.target.id==="ntg"&&e.key==="Enter"){e.preventDefault();addTag()}});
document.addEventListener("change",e=>{if(e.target.id==="fc"){fc=e.target.value;render()}});
document.addEventListener("submit",e=>{if(e.target.id!=="df")return;e.preventDefault();const er=onOk();if(er){$("err").textContent=er;return}save();dlg.close();render()});
document.addEventListener("click",e=>{const t=e.target,b=t.closest("button"),D=b?b.dataset:{};
 if(t.dataset&&t.dataset.deltag){const g=t.dataset.deltag;custom=custom.filter(x=>x!==g);sel=sel.filter(x=>x!==g);retp();save();onTag&&onTag();return}
 if(b&&"install" in D){installApp();return}
 if(b&&"tab" in D){tab=D.tab;render();window.scrollTo(0,0);return}
 if(b&&"fab" in D){tab==="items"?dItem():tab==="market"?dQuote():dClient();return}
 if(b&&"fs" in D){fs=D.fs;render();return}
 if(b&&"sell" in D){dSell(+D.sell);return}
 if(b&&"undo" in D){const i=items.find(x=>x.id===D.undo);i.sell=null;i.soldAt=null;i.client=null;save();render();return}
 if(b&&"tg" in D){const g=D.tg;sel=sel.includes(g)?sel.filter(x=>x!==g):[...sel,g];retp();onTag&&onTag();return}
 if(b&&"newtag" in D){addTag();return}
 if(b&&"qt" in D){const n=norm(D.qt),w=mqv.trim().split(/\s+/).filter(Boolean),k=w.findIndex(x=>norm(x)===n);k>=0?w.splice(k,1):w.push(D.qt);
  mqv=w.join(" ");$("mq").value=mqv;qchips();mres();return}
 if(b&&"close" in D){dlg.close();return}
 if(b&&"ddel" in D){if(!b.dataset.a){b.dataset.a=1;b.textContent="Точно видалити?";return}onDel();save();dlg.close();render();return}
 const g=t.closest("[data-g]");if(g){const T=parseQ(mqv);mqv=T.model+" "+g.dataset.g;$("mq").value=mqv;qchips();mres();return}
 const eq=t.closest("[data-eq]");if(eq){dQuote(+eq.dataset.eq);return}
 const ce=t.closest("[data-e]");if(ce){dItem(+ce.dataset.e);return}
 const cc=t.closest("[data-ec]");if(cc)dClient(+cc.dataset.ec)});
render();
</script>
</body>
</html>
