<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Перекуп CRM</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#e3e6ea;--ac:#7c3aed;--gain:#16a34a;--loss:#dc2626;--chip:#eef0f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b22;--tx:#eceff3;--mut:#9aa3af;--bd:#272c36;--ac:#a78bfa;--gain:#4ade80;--loss:#f87171;--chip:#222732}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b22;--tx:#eceff3;--mut:#9aa3af;--bd:#272c36;--ac:#a78bfa;--gain:#4ade80;--loss:#f87171;--chip:#222732}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}
nav{width:190px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;flex:none}
nav h1{font-size:17px;margin:0 8px 16px}
nav button{display:block;width:100%;text-align:left;margin-bottom:4px}
nav .ic{margin-right:8px}
main{flex:1;min-width:0;padding:20px;max-width:960px}
h2{font-size:20px;margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card span{display:block;color:var(--mut);font-size:12px}.card b{font-size:19px}
.gain{color:var(--gain)}.loss{color:var(--loss)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:16px}
.panel h3{margin:0 0 8px;font-size:15px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--bd)}
td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr[data-e],tr[data-ec],tr[data-eq],tr[data-g]{cursor:pointer}tr[data-e]:hover,tr[data-ec]:hover,tr[data-eq]:hover,tr[data-g]:hover{background:var(--chip)}
td.r,th.r{text-align:right;white-space:nowrap}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 6px;font-size:12px;margin-right:6px;color:var(--mut)}
.tg{display:inline-block;font-size:11px;background:var(--chip);color:var(--ac);border-radius:6px;padding:1px 7px;margin:4px 4px 0 0;font-weight:600}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bar select{width:auto}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.ghost{background:var(--chip);color:var(--tx)}
nav button.on{background:var(--ac);color:#fff}
button.sm{padding:5px 10px;font-size:13px}
.chip{padding:6px 11px;font-size:13px;border-radius:16px;margin:0 6px 6px 0;background:var(--chip);color:var(--tx)}
.chip.on{background:var(--ac);color:#fff}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(440px,94vw);max-height:90vh;overflow:auto;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 4px}
.btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{display:flex;gap:6px;margin-top:4px}.add button{flex:none}
.hint{font-size:13px;color:var(--ac);margin-top:8px;min-height:18px}.err{color:var(--loss);font-size:13px}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:14px;text-align:center}
.big{font-size:22px;font-weight:700}
@media (max-width:760px){
 .app{display:block}main{padding:14px 14px 90px}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:5;width:auto;display:flex;gap:4px;border-right:0;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
 nav h1{display:none}nav button{flex:1;text-align:center;margin:0;padding:6px 2px;font-size:12px}
 nav .ic{display:block;margin:0 0 2px;font-size:19px}
 .bar select,.bar button{flex:1}
 table{min-width:0}table,tbody,tr,td{display:block}tr.hd{display:none}
 tr{padding:8px 0;border-bottom:1px solid var(--bd)}tr:last-child{border-bottom:0}
 td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
 td::before{content:attr(data-l);color:var(--mut);text-align:left;font-size:13px;flex:none}
 td.nm{text-align:left;font-weight:600;display:block}td.nm::before,td[data-l=""]::before{content:none}
 td[data-l=""]{justify-content:flex-end}
 .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<dialog id="dlg"></dialog>
<datalist id="dn"></datalist><datalist id="dc"></datalist>
<script>
const K1="reseller-items-v1",K2="reseller-clients-v1",K3="reseller-quotes-v1",K4="reseller-tags-v1";
const CATS=["Авто","Аксесуари","Одяг","Інше"],DEF=["ФТ","Гідра","Пневма","Тонер","Вініл","Диски","Антихром"];
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
let items=ld(K1).map(i=>({cat:"Інше",client:null,...i,buy:(i.buy||0)+(i.extra||0),extra:0,tags:i.tags||String(i.tune||"").split(/[,;]+/).map(s=>s.trim()).filter(Boolean)}));
let clients=ld(K2),quotes=ld(K3),custom=ld(K4);
const save=()=>{try{localStorage.setItem(K1,JSON.stringify(items));localStorage.setItem(K2,JSON.stringify(clients));localStorage.setItem(K3,JSON.stringify(quotes));localStorage.setItem(K4,JSON.stringify(custom))}catch(e){}};
let tab="items",q="",fs="all",fc="all",mqv="",onOk=null,onDel=null,onTag=null,dNew=false,sel=[];
const $=id=>document.getElementById(id),dlg=$("dlg");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LK={"а":"a","в":"b","е":"e","к":"k","м":"m","н":"h","о":"o","р":"p","с":"c","т":"t","у":"y","х":"x","і":"i"};
const norm=s=>[...String(s).toLowerCase()].map(c=>LK[c]||c).join(""),nsp=s=>norm(s).replace(/\s+/g,""),key=s=>s.trim().toLowerCase();
const allTags=()=>[...DEF,...custom];
function pm(s){s=String(s||"").toLowerCase().replace(/\s/g,"").replace(",",".").replace(/k/g,"к");
 const m=s.match(/^(\d*\.?\d+)(к{0,3})$/);return m?parseFloat(m[1])*[1,1e3,1e6,1e9][m[2].length]:NaN}
function fm(n){const a=Math.abs(n),r=x=>(Math.round(x*100)/100).toLocaleString("uk-UA");
 return a>=1e9?r(n/1e9)+" ккк":a>=1e6?r(n/1e6)+" кк":a>=1e3?r(n/1e3)+" к":r(n)}
const sg=n=>(n>0?"+":"")+fm(n),cls=n=>n>0?"gain":n<0?"loss":"",profit=i=>i.sell-i.buy,cl=id=>clients.find(c=>c.id===id);
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null,dt=t=>new Date(t).toLocaleDateString("uk-UA");
const tgs=t=>t.length?t.map(x=>`<span class="tg">${esc(x)}</span>`).join(""):`<span class="tg" style="color:var(--mut)">сток</span>`;
const mem=n=>{const h=items.filter(i=>key(i.name)===key(n)).sort((a,b)=>b.id-a.id);return h.length?{b:h[0],s:h.find(i=>i.sell!=null)}:null};
function who(nm){nm=nm.trim();if(!nm)return null;let c=clients.find(x=>key(x.name)===key(nm));if(!c){c={id:Date.now(),name:nm,note:""};clients.push(c)}return c.id}
const td=(l,v,c="")=>`<td data-l="${l}" class="${c}">${v}</td>`;
const tbl=(h,rows,empty)=>rows.length?`<div class="wrap"><table><tr class="hd">${h.map(x=>`<th class="${x[1]||""}">${x[0]}</th>`).join("")}</tr>${rows.join("")}</table></div>`:`<div class="empty">${empty}</div>`;
const nameCell=i=>`<span class="tag">${i.cat}</span>${esc(i.name)}${i.cat==="Авто"||i.tags.length?`<div>${tgs(i.tags)}</div>`:""}`;

// ринок: пошук цін
function parseQ(t){const T=allTags().map(x=>[norm(x),x]),r={model:[],tags:[],stock:false};
 t.trim().split(/\s+/).filter(Boolean).forEach(w=>{const n=norm(w),f=T.find(x=>x[0]===n);if(n===norm("сток"))r.stock=true;else if(f)r.tags.push(f[1]);else r.model.push(w)});
 r.model=r.model.join(" ");return r}
function qm(model,tags,stock,exact){const m=nsp(model);return quotes.filter(x=>(!m||nsp(x.name).includes(m))&&(stock?!x.tags.length:tags.every(t=>x.tags.some(y=>norm(y)===norm(t)))&&(!exact||x.tags.length===tags.length)))}

function render(){
 $("nav").innerHTML=`<h1>🚗 Перекуп CRM</h1>`+[["items","📦","Товари"],["market","📈","Ринок"],["clients","👥","Клієнти"]].map(([k,i,l])=>`<button class="ghost ${tab===k?"on":""}" data-tab="${k}"><span class="ic">${i}</span>${l}</button>`).join("");
 $("dn").innerHTML=[...new Set([...items,...quotes].map(i=>i.name))].map(n=>`<option value="${esc(n)}">`).join("");
 $("dc").innerHTML=clients.map(c=>`<option value="${esc(c.name)}">`).join("");
 $("main").innerHTML={items:vItems,market:vMarket,clients:vClients}[tab]();
 if(tab==="market"){qchips();mres()}
}
function itemRows(){
 const L=items.filter(i=>(fs==="all"||(fs==="sold")===(i.sell!=null))&&(fc==="all"||i.cat===fc)&&(!q||nsp(i.name+" "+i.tags.join(" ")).includes(nsp(q)))).sort((a,b)=>b.id-a.id);
 return tbl([["Товар"],["Ціна","r"],["Продав","r"],["Прибуток","r"],["Покупець"],["",""]],L.map(i=>{const s=i.sell!=null;
  return `<tr data-e="${i.id}">${td("Товар",nameCell(i),"nm")}${td("Ціна",fm(i.buy),"r")}${td("Продав",s?fm(i.sell):"—","r")}${td("Прибуток",s?sg(profit(i)):"","r "+(s?cls(profit(i)):""))}${td("Покупець",esc(cl(i.client)?.name||""),"mut")}
  ${td("",s?`<button class="ghost sm" data-undo="${i.id}">↩ Повернути</button>`:`<button class="sm" data-sell="${i.id}">Продати</button>`,"r")}</tr>`}),"Порожньо")}
function vItems(){
 const so=items.filter(i=>i.sell!=null),p=so.reduce((s,i)=>s+profit(i),0);
 return `<h2>Товари</h2><div class="cards"><div class="card"><span>Прибуток</span><b class="${cls(p)}">${sg(p)}</b></div><div class="card"><span>Продано</span><b>${so.length}</b></div><div class="card"><span>В наявності</span><b>${items.length-so.length}</b></div></div>
 <div class="bar"><input id="q" placeholder="🔎 Пошук (назва, тюнінг)" value="${esc(q)}">
 <select id="fs">${[["all","Всі"],["stock","В наявності"],["sold","Продані"]].map(([k,l])=>`<option value="${k}" ${fs===k?"selected":""}>${l}</option>`).join("")}</select>
 <select id="fc"><option value="all">Усі категорії</option>${CATS.map(c=>`<option ${fc===c?"selected":""}>${c}</option>`).join("")}</select>
 <button data-add="item">+ Товар</button></div><div class="panel" id="lst">${itemRows()}</div>`}
function vClients(){
 const rows=clients.slice().sort((a,b)=>b.id-a.id).map(c=>{const b=items.filter(i=>i.client===c.id&&i.sell!=null),p=b.reduce((s,i)=>s+profit(i),0);
  return `<tr data-ec="${c.id}">${td("Нік",esc(c.name),"nm")}${td("Нотатка",esc(c.note),"mut")}${td("Покупок",b.length,"r")}${td("Сума",fm(b.reduce((s,i)=>s+i.sell,0)),"r")}${td("Прибуток",b.length?sg(p):"","r "+cls(p))}</tr>`});
 return `<h2>Клієнти</h2><div class="bar"><button data-add="client">+ Клієнт</button></div><div class="panel">${tbl([["Нік"],["Нотатка / контакт"],["Покупок","r"],["Сума","r"],["Прибуток","r"]],rows,"Клієнтів ще немає. Їх можна вписати й при продажі.")}</div>`}

function vMarket(){return `<h2>Ринок</h2><div class="panel"><input id="mq" placeholder="Напр.: х5м фт  або  х5м сток" value="${esc(mqv)}" autocomplete="off">
 <div id="qc" style="margin-top:10px"></div><div id="mres"></div></div>`}
function qchips(){const T=parseQ(mqv),on=t=>T.tags.includes(t);
 $("qc").innerHTML=`<button class="chip ${T.stock?"on":""}" data-qt="сток">Сток</button>`+allTags().map(t=>`<button class="chip ${on(t)?"on":""}" data-qt="${esc(t)}">${esc(t)}</button>`).join("")}
function mres(){
 const el=$("mres"),T=parseQ(mqv);
 if(!T.model){const rec=quotes.slice().sort((a,b)=>b.id-a.id).slice(0,10).map(x=>qRow(x));
  el.innerHTML=`<div class="hint" style="margin-bottom:6px">Пиши модель і тюнінг, напр. «х5м фт» або «х5м сток». Ціни, які питаєш у людей, додавай кнопкою нижче.</div><div class="bar"><button data-addq>+ Додати ціну</button></div>
  <h3 style="margin:8px 0 4px;font-size:15px">Останні ціни</h3>${tbl([["Модель"],["Ціна","r"],["Примітка"],["Дата"]],rec,"Цін ще немає")}`;return}
 const R=qm(T.model,T.tags,T.stock).sort((a,b)=>a.price-b.price),what=`${esc(T.model)}${T.stock?" · сток":""}${T.tags.length?" · "+esc(T.tags.join(" + ")):""}`;
 if(!R.length){el.innerHTML=`<div class="empty">Цін по «${what}» ще немає.</div><div class="bar"><button data-addq>+ Додати ціну</button></div>`;return}
 const P=R.map(x=>x.price);let g="";
 if(!T.tags.length&&!T.stock){const m=new Map();R.forEach(x=>{const k=x.tags.slice().sort().join(" + ")||"Сток";(m.get(k)||m.set(k,[]).get(k)).push(x.price)});
  g=`<h3 style="margin:14px 0 4px;font-size:15px">По тюнінгу</h3>`+tbl([["Тюнінг"],["Цін","r"],["Середня","r"]],[...m].map(([k,v])=>`<tr data-g="${esc(k==="Сток"?"сток":k.split(" + ").join(" "))}">${td("Тюнінг",esc(k),"nm")}${td("Цін",v.length,"r")}${td("Середня",fm(avg(v)),"r")}</tr>`),"")}
 el.innerHTML=`<h3 style="margin:14px 0 8px">${what}</h3><div class="cards"><div class="card"><span>Середня ціна</span><b>${fm(avg(P))}</b></div><div class="card"><span>Мін – Макс</span><b>${fm(P[0])} – ${fm(P[P.length-1])}</b></div><div class="card"><span>Цін вписано</span><b>${R.length}</b></div></div>
 <div class="bar"><button data-addq>+ Додати ціну</button></div>${g}<h3 style="margin:14px 0 4px;font-size:15px">Усі ціни</h3>${tbl([["Модель"],["Ціна","r"],["Примітка"],["Дата"]],R.map(qRow),"")}`}
const qRow=x=>`<tr data-eq="${x.id}">${td("Модель",`${esc(x.name)}<div>${tgs(x.tags)}</div>`,"nm")}${td("Ціна",fm(x.price),"r")}${td("Примітка",esc(x.note||""),"mut")}${td("Дата",dt(x.id),"mut")}</tr>`;

// діалоги
function tp(){return `<div id="tp">${allTags().map(t=>`<button type="button" class="chip ${sel.includes(t)?"on":""}" data-tg="${esc(t)}">${esc(t)}${custom.includes(t)?` <span data-deltag="${esc(t)}">✕</span>`:""}</button>`).join("")}</div>
 <div class="add"><input id="ntg" placeholder="Свій тег (напр. Карбон)"><button type="button" class="ghost" data-newtag>+</button></div>`}
function open(html,ok,del){dlg.innerHTML=`<form id="df" autocomplete="off">${html}<div class="err" id="err"></div><div class="btns">${del?`<button type="button" class="ghost" data-ddel style="margin-right:auto">Видалити</button>`:""}<button type="button" class="ghost" data-close>Скасувати</button><button type="submit">Зберегти</button></div></form>`;onOk=ok;onDel=del;dlg.showModal()}
function ihint(){const h=$("hint");if(!h)return;const n=$("dn1").value;if(!n.trim()){h.textContent="";return}
 const Q=qm(n,sel,!sel.length,true),a=avg(Q.map(x=>x.price));h.textContent=a!=null?`Ринок: сер. ${fm(a)} (${Q.length} цін)`:"";return a}
function dItem(id){const i=items.find(x=>x.id===id),sold=i&&i.sell!=null;dNew=!i;sel=i?i.tags.slice():[];onTag=ihint;
 open(`<h3>${i?"Товар":"Новий товар"}</h3><label>Назва</label><input id="dn1" list="dn" value="${esc(i?.name)}" required>
 <div class="g2"><div><label>Категорія</label><select id="dcat">${CATS.map(c=>`<option ${c===i?.cat?"selected":""}>${c}</option>`).join("")}</select></div>
 <div><label>Ціна купівлі (15кк, 300к)</label><input id="db" value="${i?i.buy:""}" required></div></div>
 <label>🔧 Тюнінг (нічого не вибрано = сток)</label>${tp()}
 ${sold?`<div class="g2"><div><label>Продав за</label><input id="ds" value="${i.sell}"></div><div><label>Покупець</label><input id="dcl" list="dc" value="${esc(cl(i.client)?.name)}"></div></div>`:""}
 <div class="hint" id="hint"></div>`,
 ()=>{const b=pm($("db").value);if(isNaN(b))return"Формат суми: 15кк, 2.5кк, 300к або число";
  let s=null;if(sold){s=$("ds").value.trim()?pm($("ds").value):null;if(isNaN(s))return"Невірна ціна продажу"}
  const o=i||{id:Date.now(),sell:null,soldAt:null,client:null};Object.assign(o,{name:$("dn1").value.trim(),cat:$("dcat").value,buy:b,tags:sel.slice()});
  if(sold){o.sell=s;if(s==null){o.soldAt=null;o.client=null}else o.client=who($("dcl").value)}
  if(!i)items.push(o)},i?()=>{items=items.filter(x=>x!==i)}:null);ihint()}
function dSell(id){const i=items.find(x=>x.id===id),Q=qm(i.name,i.tags,!i.tags.length,true),a=avg(Q.map(x=>x.price));
 open(`<h3>Продаж: ${esc(i.name)}</h3><div>${tgs(i.tags)}</div><div class="mut" style="margin-top:6px">Купив за ${fm(i.buy)}</div>
 <label>Продав за</label><input id="ds" placeholder="${a!=null?"ринок: "+fm(a):"15кк, 300к"}" required><label>Покупець (нік)</label><input id="dcl" list="dc">
 <div class="hint">${a!=null?`Ринок: сер. ${fm(a)} (${Q.length} цін) — це ${sg(a-i.buy)}`:""}</div>`,
 ()=>{const v=pm($("ds").value);if(isNaN(v))return"Формат суми: 15кк, 2.5кк, 300к або число";i.sell=v;i.soldAt=Date.now();i.client=who($("dcl").value)})}
function dQuote(id){const x=quotes.find(z=>z.id===id),T=parseQ(mqv);dNew=false;sel=x?x.tags.slice():T.tags.slice();onTag=null;
 open(`<h3>${x?"Ціна на ринку":"Нова ціна з ринку"}</h3><label>Модель</label><input id="qn" list="dn" value="${esc(x?x.name:T.model)}" required>
 <label>🔧 Тюнінг (нічого не вибрано = сток)</label>${tp()}<div class="g2"><div><label>Ціна (15кк, 300к)</label><input id="qp" value="${x?x.price:""}" required></div><div><label>Примітка</label><input id="qx" value="${esc(x?.note)}" placeholder="хто, де, торг…"></div></div>`,
 ()=>{const p=pm($("qp").value);if(isNaN(p))return"Формат суми: 15кк, 2.5кк, 300к або число";
  const o=x||{id:Date.now()};Object.assign(o,{name:$("qn").value.trim(),tags:sel.slice(),price:p,note:$("qx").value.trim()});if(!x)quotes.push(o);
  mqv=o.name+(o.tags.length?" "+o.tags.join(" "):" сток")},x?()=>{quotes=quotes.filter(z=>z!==x)}:null)}
function dClient(id){const c=clients.find(x=>x.id===id);
 open(`<h3>${c?"Клієнт":"Новий клієнт"}</h3><label>Нік</label><input id="dcn" value="${esc(c?.name)}" required><label>Нотатка / контакт</label><input id="dcx" value="${esc(c?.note)}">`,
 ()=>{const o=c||{id:Date.now()};o.name=$("dcn").value.trim();o.note=$("dcx").value.trim();if(!c)clients.push(o)},
 c?()=>{clients=clients.filter(x=>x!==c);items.forEach(i=>{if(i.client===c.id)i.client=null})}:null)}
function addTag(){const v=$("ntg").value.trim();if(!v)return;if(!allTags().some(t=>norm(t)===norm(v)))custom.push(v);const t=allTags().find(t=>norm(t)===norm(v));if(!sel.includes(t))sel.push(t);$("tp").outerHTML=tp();save();onTag&&onTag()}

document.addEventListener("input",e=>{const id=e.target.id;
 if(id==="q"){q=e.target.value;$("lst").innerHTML=itemRows()}
 else if(id==="mq"){mqv=e.target.value;qchips();mres()}
 else if(id==="dn1"){if(dNew){const m=mem(e.target.value);if(m){$("dcat").value=m.b.cat;$("db").value=m.b.buy;sel=m.b.tags.slice();$("tp").outerHTML=tp()}}
  ihint()}});
document.addEventListener("keydown",e=>{if(e.target.id==="ntg"&&e.key==="Enter"){e.preventDefault();addTag()}});
document.addEventListener("change",e=>{const id=e.target.id;if(id==="fs"){fs=e.target.value;render()}else if(id==="fc"){fc=e.target.value;render()}});
document.addEventListener("submit",e=>{if(e.target.id!=="df")return;e.preventDefault();const er=onOk();if(er){$("err").textContent=er;return}save();dlg.close();render()});
document.addEventListener("click",e=>{const t=e.target,b=t.closest("button"),D=b?b.dataset:{};
 if(t.dataset&&t.dataset.deltag){const g=t.dataset.deltag;custom=custom.filter(x=>x!==g);sel=sel.filter(x=>x!==g);$("tp").outerHTML=tp();save();onTag&&onTag();return}
 if(b&&"tab" in D){tab=D.tab;render();window.scrollTo(0,0);return}
 if(b&&"sell" in D){dSell(+D.sell);return}
 if(b&&"undo" in D){const i=items.find(x=>x.id==D.undo);i.sell=null;i.soldAt=null;i.client=null;save();render();return}
 if(b&&"add" in D){D.add==="item"?dItem():dClient();return}
 if(b&&"addq" in D){dQuote();return}
 if(b&&"tg" in D){const g=D.tg;sel=sel.includes(g)?sel.filter(x=>x!==g):[...sel,g];$("tp").outerHTML=tp();onTag&&onTag();return}
 if(b&&"newtag" in D){addTag();return}
 if(b&&"qt" in D){const n=norm(D.qt),w=mqv.trim().split(/\s+/).filter(Boolean),k=w.findIndex(x=>norm(x)===n);k>=0?w.splice(k,1):w.push(D.qt);
  mqv=w.join(" ");$("mq").value=mqv;qchips();mres();return}
 if(b&&"close" in D){dlg.close();return}
 if(b&&"ddel" in D){if(!b.dataset.a){b.dataset.a=1;b.textContent="Точно видалити?";return}onDel();save();dlg.close();render();return}
 const g=t.closest("tr[data-g]");if(g){const T=parseQ(mqv);mqv=T.model+" "+g.dataset.g;$("mq").value=mqv;qchips();mres();return}
 const eq=t.closest("tr[data-eq]");if(eq){dQuote(+eq.dataset.eq);return}
 const tr=t.closest("tr[data-e]");if(tr&&!b){dItem(+tr.dataset.e);return}
 const tc=t.closest("tr[data-ec]");if(tc)dClient(+tc.dataset.ec)});
render();
</script>
</body>
</html>
